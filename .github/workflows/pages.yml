name: Publish portfolio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', 'site/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate website assets
        shell: python
        run: |
          import pathlib, re
          root = pathlib.Path("site")
          html = (root / "index.html").read_text(encoding="utf-8")
          assets = set(re.findall(r"assets/[A-Za-z0-9_./-]+", html))
          missing = [name for name in assets if not (root / name).is_file()]
          if missing:
              raise RuntimeError(f"Missing assets: {missing}")
          print(f"Validated {len(assets)} local assets")
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
